# Example configuration file
# Copy this file to secrets.toml and populate with your credentials.

# Optional: enable WooCommerce integration.
[woocommerce]
store_url = "https://deencommerce.com"
consumer_key = "your_consumer_key"
consumer_secret = "your_consumer_secret"

[pathao]
base_url = "https://api-hermes.pathao.com"
client_id = "your_client_id"
client_secret = "your_client_secret"
username = "your_email@domain.com"
password = "your_password"

[llm]
# Add your API keys below. You only need to provide the ones you want to use.
openrouter_key = "sk-or-v1-..."
gemini_key = "AIzaSy..."
groq_key = "gsk_..."
huggingface_key = "hf_..."

# --- Google Analytics 4 (GA4) ---
[ga4]
property_id = "properties/123456789"

# --- GCP Service Account Credentials ---
[gcp_service_account]
type = "service_account"
project_id = "your-project-id"
private_key_id = "your-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-project.iam.gserviceaccount.com"
client_id = "your-client-id"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/..."
universe_domain = "googleapis.com"

# --- Meta Ads & Pixel Section ---
[meta]
pixel_id = "your_meta_pixel_id"
ad_account_id = "act_your_ad_account_id"
access_token = "your_meta_access_token"
